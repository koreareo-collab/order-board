<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>폴더별 메일 요약</title>
<link rel="icon" type="image/png" href="board-assets/icon-192.png">
<link rel="apple-touch-icon" href="board-assets/icon-192.png">
<style>
  :root { --bg: #0a0d13; --panel: #131822; --panel2: #1a2130; --line: #232c3d; --text: #e9edf4; --muted: #8b95a8; --dim: #5b6578;
    --accent: #5aa9ff; --new: #6fe0a8; --warn: #f5b942; --bad: #ff5c5c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 14px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; }
  .lnk { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--accent); text-decoration: none; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
  .tabs button { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
  .tabs button.on { color: var(--text); border-color: var(--accent); background: rgba(90,169,255,.14); }
  .tabs .cnt { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 12px; text-align: center; }
  .tabs .cnt.zero { background: var(--panel2); color: var(--dim); }
  .opts { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .src { color: var(--dim); font-size: 12.5px; margin-bottom: 12px; }
  .day { padding: 6px 4px; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-top: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .card.unread { border-left: 4px solid var(--new); }
  .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .from { font-weight: 700; font-size: 15px; }
  .time { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .subj { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
  .sum { font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
  .sum.raw { color: var(--muted); font-size: 13.5px; }
  .atts { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .att { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--muted); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: rgba(111,224,168,.16); color: var(--new); margin-left: 6px; }
  .msg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 10px 0; line-height: 1.6; }
  footer { color: var(--dim); font-size: 12px; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>폴더별 메일 요약</h1>
    <div><span id="tabLinks"><a class="lnk" href="./">오더보드</a> <a class="lnk" href="orders.html">원단·출고 일정</a></span></div>
  </header>
  <div class="src" id="src">불러오는 중…</div>
  <div id="note"></div>
  <div class="tabs" id="tabs"></div>
  <div class="opts"><label><input type="checkbox" id="onlyUnread"> 안 읽은 메일만</label></div>
  <div id="list"></div>
  <footer>노트북 Outlook의 Inbox 하위 폴더(분류 규칙으로 나뉜 메일)를 2분마다 요약해서 올립니다. 최근 3일 메일만 보여 주고, 초록 줄은 Outlook에서 아직 안 읽은 메일입니다.<br>
  노트북이 꺼져 있으면 마지막으로 올라간 내용을 보여 줍니다. 이 화면은 1분마다 새로고침됩니다.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LS = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const REPO = LS.get('ob.repo') || '', TOKEN = LS.get('ob.token') || '';
const WD = ['일', '월', '화', '수', '목', '금', '토'];
let DATA = null, cur = LS.get('ml.folder') || '', onlyUnread = LS.get('ml.unread') === '1';

async function fetchData() {
  // on the laptop itself: read the local copy (no access key needed)
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    const r = await fetch('/mail-data.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('노트북 메일 요약 자료가 아직 없습니다');
    return r.json();
  }
  if (REPO && TOKEN) {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/mail.json`, {
      headers: { Authorization: `Bearer ${TOKEN}`, Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? '접근 키가 만료되었거나 권한이 없습니다 (오더보드 설정에서 다시 입력)' : r.status === 404 ? '아직 메일 자료가 올라오지 않았습니다' : 'GitHub 응답 ' + r.status);
    return r.json();
  }
  throw new Error('NOKEY');
}
function dayLabel(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((t - x) / 86400000);
  const base = `${x.getMonth() + 1}/${x.getDate()} (${WD[x.getDay()]})`;
  return diff === 0 ? '오늘 ' + base : diff === 1 ? '어제 ' + base : base;
}
function render() {
  if (!DATA) return;
  const fs = DATA.folders || [];
  if (!fs.find(f => f.name === cur)) cur = (fs.find(f => f.unread) || fs[0] || {}).name || '';
  $('tabs').innerHTML = fs.map(f => `<button data-f="${esc(f.name)}" class="${f.name === cur ? 'on' : ''}">${esc(f.name)}<span class="cnt ${f.unread ? '' : 'zero'}">${f.unread || 0}</span></button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { cur = b.dataset.f; LS.set('ml.folder', cur); render(); });
  $('onlyUnread').checked = onlyUnread;
  const f = fs.find(x => x.name === cur) || { items: [] };
  const items = (f.items || []).filter(m => !onlyUnread || m.unread);
  let html = '', last = '';
  for (const m of items) {
    const d = new Date(m.received), lab = dayLabel(d);
    if (lab !== last) { html += `<div class="day">${esc(lab)}</div>`; last = lab; }
    const tm = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    const atts = (m.atts || []).length ? `<div class="atts">${m.atts.map(a => `<span class="att">${esc(a)}</span>`).join('')}</div>` : '';
    html += `<div class="card ${m.unread ? 'unread' : ''}"><div class="top"><span class="from">${esc(m.from)}${m.unread ? '<span class="tag">새 메일</span>' : ''}</span><span class="time">${esc(tm)}</span></div>
      <div class="subj">${esc(m.subject)}</div><div class="sum ${m.ai ? '' : 'raw'}">${esc(m.summary || '(본문 없음)')}</div>${atts}</div>`;
  }
  $('list').innerHTML = html || `<div class="msg">${onlyUnread ? '안 읽은 메일이 없습니다.' : '최근 3일 동안 이 폴더에 온 메일이 없습니다.'}</div>`;
  const up = DATA.exportedAt ? new Date(DATA.exportedAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
  $('src').innerHTML = `노트북 업로드 ${esc(up)} · ${DATA.aiKey ? 'AI 한국어 요약' : 'AI 키 없음: 본문 앞부분 표시'}`;
}
async function load() {
  try { DATA = await fetchData(); LS.set('ml.cache', JSON.stringify(DATA)); $('note').innerHTML = ''; }
  catch (e) {
    const c = LS.get('ml.cache'); if (c && !DATA) DATA = JSON.parse(c);
    $('note').innerHTML = e.message === 'NOKEY'
      ? `<div class="msg">이 탭에 오더보드 접근 키가 없습니다. 먼저 <a class="lnk" href="./">오더보드</a>를 열어 접근 키를 저장하면 이 화면도 자동으로 열립니다.</div>`
      : `<div class="msg">새 자료를 불러오지 못했습니다 (${esc(e.message)}). ${DATA ? '마지막으로 받은 자료를 보여 줍니다.' : ''}</div>`;
  }
  render();
}
$('onlyUnread').onchange = e => { onlyUnread = e.target.checked; LS.set('ml.unread', onlyUnread ? '1' : '0'); render(); };
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) $('tabLinks').hidden = true;
load(); setInterval(load, 60000);
</script>
</body>
</html>
