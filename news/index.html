<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>영어·인니어 뉴스</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./news-assets/icon-192.png">
<link rel="apple-touch-icon" href="./news-assets/icon-192.png">
<style>
  :root { --bg:#0a0d13; --panel:#141a26; --panel2:#1b2332; --line:#243043; --text:#e9edf4; --muted:#8e9ab0; --dim:#5f6a7e;
          --accent:#5aa9ff; --en:#ffd479; --id:#9ff0c0; --bbc:#ff8a8a; --idr:#ff9aa5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
         display: flex; flex-direction: column; overscroll-behavior-y: contain; }
  header { position: sticky; top: 0; z-index: 5; background: #0a0d13f2; backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px) * 0); }
  .row1 { display: flex; align-items: center; gap: 10px; }
  .brand { font-size: 17px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .tabs { display: flex; gap: 8px; flex: 1; }
  .tabs button { font: inherit; font-size: 15px; font-weight: 700; padding: 9px 16px; border-radius: 12px;
                 border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
  .tabs button.on { color: var(--text); border-color: var(--accent); background: rgba(90,169,255,.16); }
  .tabs .tag { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 5px; margin-right: 6px; vertical-align: 1px; }
  .tag.bbc { color: var(--bbc); background: rgba(187,25,25,.22); }
  .tag.id { color: var(--idr); background: rgba(206,17,38,.22); }
  .icon { font: inherit; font-size: 18px; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
          background: var(--panel); color: var(--text); display: grid; place-items: center; }
  .row2 { display: flex; align-items: center; gap: 16px; margin-top: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .row2 label { display: flex; align-items: center; gap: 6px; }
  .row2 input { width: 18px; height: 18px; accent-color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 12px 14px 40px; -webkit-overflow-scrolling: touch; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .card.top { background: linear-gradient(135deg, rgba(90,169,255,.14), rgba(90,169,255,.03)); border-color: rgba(90,169,255,.4); }
  .t { font-size: 19px; font-weight: 700; line-height: 1.45; }
  .t.note { line-height: 2.35; }
  .card.top .t { font-size: 22px; }
  .ko { color: #a9d6ff; font-size: 15px; line-height: 1.5; margin-top: 7px; }
  .d { color: var(--muted); font-size: 14px; line-height: 1.5; margin-top: 7px;
       display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; color: var(--dim); font-size: 12.5px; }
  .foot a { margin-left: auto; color: var(--accent); text-decoration: none; border: 1px solid var(--line);
            border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  ruby { ruby-position: under; margin-right: .2em; border-radius: 5px; }
  rt { font-size: 12px; font-weight: 500; color: var(--en); letter-spacing: -.02em; }
  body.idn rt { color: var(--id); }
  ruby.hit { background: rgba(90,169,255,.25); }
  .msg { color: var(--muted); padding: 24px 4px; font-size: 15px; line-height: 1.6; }
  footer { color: var(--dim); font-size: 12px; line-height: 1.6; padding: 0 2px 10px; }
  /* word sheet */
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 9; align-items: flex-end; }
  #sheet.on { display: flex; }
  #sheetBox { background: var(--panel); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0;
              width: 100%; max-height: 72vh; overflow-y: auto; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
  #sheetBox h3 { margin: 0 0 2px; font-size: 28px; }
  #sheetBox .sub { color: var(--muted); font-size: 15px; margin-bottom: 14px; }
  #sheetBox .grp { margin: 12px 0; }
  #sheetBox .grp b { color: var(--accent); font-size: 12px; font-weight: 700; display: block; margin-bottom: 3px; }
  #sheetBox .grp span { font-size: 17px; line-height: 1.5; }
  #sheetBox .grp .chain { color: var(--id); font-size: 15px; margin-top: 3px; }
  #sheetBox .close { display: block; width: 100%; margin-top: 16px; font: inherit; font-size: 16px; font-weight: 700;
                     padding: 13px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
  @media (min-width: 900px) { main { max-width: 900px; margin: 0 auto; width: 100%; } #sheet { align-items: center; justify-content: center; }
    #sheetBox { max-width: 520px; border-radius: 20px; border: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <div class="row1">
    <div class="brand">A<span>→</span>가 뉴스</div>
    <div class="tabs">
      <button data-tab="bbc"><span class="tag bbc">BBC</span>영어</button>
      <button data-tab="indonesia"><span class="tag id">🇮🇩</span>인니어</button>
    </div>
    <button class="icon" id="reload" title="새로 받기">↻</button>
  </div>
  <div class="row2">
    <label><input type="checkbox" id="optNote" checked> 단어 뜻</label>
    <label><input type="checkbox" id="optKo" checked> 문장 번역</label>
    <span id="upd"></span>
  </div>
</header>
<main id="main"><div class="msg">불러오는 중…</div></main>
<div id="sheet"><div id="sheetBox"></div></div>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SAFE = { 'bbc.com': /^https:\/\/(www\.)?bbc\.(co\.uk|com)\//, 'antaranews.com': /^https:\/\/(www\.|en\.)?antaranews\.com\// };
const ago = t => {
  if (!t) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  return m < 1 ? '방금' : m < 60 ? m + '분 전' : m < 1440 ? Math.floor(m / 60) + '시간 전' : Math.floor(m / 1440) + '일 전';
};
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } } };

let DATA = null, tab = LS.get('news.tab') || 'bbc';
$('optNote').checked = LS.get('news.note') !== '0';
$('optKo').checked = LS.get('news.ko') !== '0';

async function load(force) {
  try {
    const r = await fetch('./news.json' + (force ? '?t=' + Date.now() : ''), { cache: force ? 'reload' : 'default' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    LS.set('news.cache', JSON.stringify(DATA));
  } catch (e) {
    const c = LS.get('news.cache');
    if (c && !DATA) { DATA = JSON.parse(c); }       // offline: show the last copy
    else if (!DATA) { $('main').innerHTML = '<div class="msg">뉴스를 받지 못했습니다.<br>인터넷에 연결한 뒤 ↻ 를 눌러 주세요.</div>'; return; }
  }
  render();
}

function feedOf() { return (DATA.feeds || []).find(f => f.key === tab) || DATA.feeds[0]; }

function headline(it, lang) {
  if (!$('optNote').checked || !it.parts) return '<div class="t">' + esc(it.t) + '</div>';
  return '<div class="t note">' + it.parts.map(p => p.ko
    ? '<ruby data-w="' + esc((p.base || p.w).toLowerCase()) + '" data-l="' + lang + '">' + esc(p.w) + '<rt>' + esc(p.ko) + '</rt></ruby>'
    : esc(p.w)).join('') + '</div>';
}

function render() {
  const f = feedOf();
  document.body.classList.toggle('idn', f.lang === 'id');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const safe = u => (SAFE[f.site] || /^$/).test(u || '') ? u : null;
  const items = f.items || [];
  $('main').innerHTML = items.map((it, i) => {
    const u = safe(it.link);
    return '<div class="card' + (i === 0 ? ' top' : '') + '">'
      + headline(it, f.lang)
      + ($('optKo').checked && it.ko ? '<div class="ko">' + esc(it.ko) + '</div>' : '')
      + '<div class="d">' + esc(it.d) + '</div>'
      + '<div class="foot"><span>' + esc(f.name) + ' · ' + ago(it.time) + '</span>'
      + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">기사 열기 ↗</a>' : '') + '</div></div>';
  }).join('') || '<div class="msg">헤드라인이 없습니다.</div>';

  const built = DATA.builtAt ? new Date(DATA.builtAt) : null;
  const old = built && Date.now() - built.getTime() > 6 * 3600e3;
  $('upd').textContent = built
    ? (old ? '⚠ ' : '') + built.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' 기준'
    : '';
  $('main').insertAdjacentHTML('beforeend',
    '<footer>단어를 누르면 사전이 열립니다 · 뜻: 위키낱말사전 · kaikki.org 인도네시아어 사전 (CC BY-SA) + Google 번역'
    + '<br>출처: BBC News World · ANTARA (공개 RSS) · 30분~1시간마다 새로 만들어집니다</footer>');
}

// ---------- word sheet ----------
function openWord(w, lang, el) {
  const d = (DATA.words || {})[lang + '|' + w];
  document.querySelectorAll('ruby.hit').forEach(x => x.classList.remove('hit'));
  if (el) el.classList.add('hit');
  const wk = (d && d.dict || []).filter(x => x.ko);
  const idn = (d && d.idn || []).filter(x => x.en);
  $('sheetBox').innerHTML = '<h3>' + esc(w) + '</h3>'
    + '<div class="sub">' + esc(d ? d.ko : '') + (d && d.pos ? ' · ' + esc(d.pos) : '') + '</div>'
    + (d && d.full && d.src === 'google' ? '<div class="grp"><b>Google 사전</b><span>' + esc(d.full) + '</span></div>' : '')
    + wk.map(x => '<div class="grp"><b>위키낱말사전' + (x.pos ? ' · ' + esc(x.pos) : '') + '</b><span>' + esc(x.ko) + '</span></div>').join('')
    + idn.map(x => '<div class="grp"><b>인도네시아어 사전 · ' + esc(x.pos) + ' (영어 뜻)</b><span>' + esc(x.en) + '</span>'
        + (x.ko ? '<div class="chain">' + esc(x.ko) + '</div>' : '') + '</div>').join('')
    + (!d ? '<div class="grp">이 단어의 사전 내용이 없습니다.</div>' : '')
    + '<button class="close">닫기</button>';
  $('sheet').classList.add('on');
}
document.addEventListener('click', e => {
  const r = e.target.closest('ruby[data-w]');
  if (r) { e.preventDefault(); return openWord(r.dataset.w, r.dataset.l, r); }
  if (e.target.closest('.close') || (e.target.closest('#sheet') && !e.target.closest('#sheetBox'))) {
    $('sheet').classList.remove('on');
    document.querySelectorAll('ruby.hit').forEach(x => x.classList.remove('hit'));
  }
});

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; LS.set('news.tab', tab); render(); $('main').scrollTop = 0; });
['optNote', 'optKo'].forEach(id => $(id).onchange = () => {
  LS.set('news.note', $('optNote').checked ? '1' : '0');
  LS.set('news.ko', $('optKo').checked ? '1' : '0');
  render();
});
$('reload').onclick = async () => { $('reload').textContent = '…'; await load(true); $('reload').textContent = '↻'; };

const cached = LS.get('news.cache');
if (cached) { try { DATA = JSON.parse(cached); render(); } catch (e) { } }   // show the last copy at once
load();
setInterval(() => load(true), 30 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => { });
</script>
</body>
</html>
