<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>원단·출고 일정</title>
<link rel="icon" type="image/png" href="board-assets/icon-192.png">
<link rel="apple-touch-icon" href="board-assets/icon-192.png">
<style>
  :root { --bg: #0a0d13; --panel: #131822; --panel2: #1a2130; --line: #232c3d; --text: #e9edf4; --muted: #8b95a8; --dim: #5b6578;
    --accent: #5aa9ff; --fab: #6fe0a8; --ship: #ff9b6a; --warn: #f5b942; --bad: #ff5c5c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px 14px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button, .lnk { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; text-decoration: none; }
  .tabs button.on { color: var(--text); border-color: var(--accent); background: rgba(90,169,255,.14); }
  .lnk { color: var(--accent); }
  .src { color: var(--dim); font-size: 12.5px; margin-bottom: 14px; }
  .src b { color: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  section > h2 { margin: 0; padding: 14px 16px 10px; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  section.fab > h2 { color: var(--fab); } section.ship > h2 { color: var(--ship); }
  h2 .sum { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .day { padding: 6px 16px; font-size: 12.5px; font-weight: 700; color: var(--muted); background: var(--panel2); border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .day.late { color: var(--bad); }
  details { border-top: 1px solid var(--line); }
  summary { list-style: none; cursor: pointer; padding: 10px 16px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: baseline; }
  summary::-webkit-details-marker { display: none; }
  .dd { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: rgba(90,169,255,.16); color: var(--accent); white-space: nowrap; }
  .dd.hot { background: rgba(245,185,66,.2); color: var(--warn); }
  .dd.late { background: rgba(255,92,92,.2); color: var(--bad); }
  .sty { font-weight: 700; font-size: 15px; }
  .nm { color: var(--muted); font-size: 12.5px; font-weight: 400; margin-left: 6px; }
  .qty { font-family: Consolas, monospace; font-size: 14px; }
  .fac { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
  .meta { grid-column: 2 / -1; color: var(--dim); font-size: 12px; margin-top: -4px; }
  .meta .iss { color: var(--warn); }
  .more { padding: 4px 16px 12px 16px; font-size: 12.5px; color: var(--muted); }
  .more dt { color: var(--dim); font-size: 11.5px; margin-top: 6px; }
  .more dd { margin: 2px 0 0; white-space: pre-wrap; color: var(--text); }
  .empty { padding: 18px 16px; color: var(--muted); border-top: 1px solid var(--line); }
  .msg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 10px 0; line-height: 1.6; }
  footer { color: var(--dim); font-size: 12px; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>원단 자카르타 도착 · 출고 EX-FACTORY</h1>
    <div class="tabs">
      <button data-d="10">10일</button><button data-d="20">20일</button><button data-d="30">30일</button>
      <a class="lnk" href="./">오더보드</a>
      <a class="lnk" id="gayaLink" href="#" hidden>GAYA 검색</a>
    </div>
  </header>
  <div class="src" id="src">불러오는 중…</div>
  <div id="note"></div>
  <div class="cols">
    <section class="fab"><h2>원단 자카르타 도착 <span class="sum" id="fabSum"></span></h2><div id="fab"></div></section>
    <section class="ship"><h2>출고 EX-FACTORY <span class="sum" id="shipSum"></span></h2><div id="ship"></div></section>
  </div>
  <footer>노트북 "원단·출고 일정"과 같은 자료(Order Status)입니다. 노트북이 꺼져 있어도 마지막으로 올라간 자료를 보여 줍니다.<br>
  원단: 아직 입고되지 않은(OK가 아닌) 스타일 중 예정일이 기간 안에 있는 것 + 예정일이 지났는데 입고되지 않은 것(최근 7일, 빨간색). 행을 누르면 상세가 펼쳐집니다. 5분마다 새로고침.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => Number(v || 0).toLocaleString('en-US');
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const LS = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
// same access key the Order Board saved on this tablet (same site)
const REPO = LS.get('ob.repo') || '', TOKEN = LS.get('ob.token') || '';
const OVERDUE = 7;
let days = +(LS.get('to.days') || 10);

// ---- same rules as the laptop page (orders.js) ----
function nearestDate(m, d, today) {
  let best = null;
  for (const y of [today.getFullYear() - 1, today.getFullYear(), today.getFullYear() + 1]) {
    const x = new Date(y, m - 1, d);
    if (!best || Math.abs(x - today) < Math.abs(best - today)) best = x;
  }
  return best;
}
const dayDiff = (a, b) => Math.round((a - b) / 86400000);
const firstLine = s => String(s || '').split('\n').map(x => x.trim()).find(Boolean) || '';
const issueText = s => { const t = String(s || '').split('\n').map(x => x.trim()).filter(Boolean).join(' ').replace(/\s+/g, ' '); return t ? (t.length > 60 ? t.slice(0, 58) + '…' : t) : null; };
function windows(rows, windowDays) {
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const fabric = [], ship = [];
  for (const r of rows) {
    const base = { style: r.style, name: r.name, qty: r.qty, vendor: r.vendor, season: r.season, buy: r.buy, factory: (r.facs || []).join('+'), alv: r.alv || null,
      fab: r.fab || '', fd: r.fd || '', td: r.td || '', iss: r.iss || '', note: r.note || '', exf: r.exf || '' };
    const fab = String(r.fab || '');
    if (!/^OK/i.test(fab)) {
      const m = fab.match(/(\d{1,2})\/(\d{1,2})/);
      if (m) { const d = nearestDate(+m[1], +m[2], today), dd = dayDiff(d, today);
        if (dd >= -OVERDUE && dd <= windowDays) fabric.push({ ...base, days: dd, status: fab, detail: firstLine(r.fd) || firstLine(r.td) || r.name || '' }); }
    }
    for (const m of String(r.exf || '').matchAll(/(\d{1,2})\/(\d{1,2})/g)) {
      const d = nearestDate(+m[1], +m[2], today), dd = dayDiff(d, today);
      if (dd >= 0 && dd <= windowDays) ship.push({ ...base, days: dd, status: r.exf, detail: r.name || '', issue: issueText(r.iss) });
    }
  }
  const sort = (a, b) => a.days - b.days || b.qty - a.qty;
  return { fabric: fabric.sort(sort), ship: ship.sort(sort) };
}

const dayLabel = d => {
  const dt = new Date(); dt.setHours(0, 0, 0, 0); dt.setDate(dt.getDate() + d.days);
  const when = d.days < 0 ? `${-d.days}일 지남` : d.days === 0 ? '오늘' : d.days === 1 ? '내일' : `D-${d.days}`;
  return `${dt.getMonth() + 1}/${dt.getDate()} (${WD[dt.getDay()]}) · ${when}`;
};
const badge = d => d.days < 0 ? `<span class="dd late">${-d.days}일 지남</span>` : `<span class="dd ${d.days <= 3 ? 'hot' : ''}">${d.days === 0 ? '오늘' : 'D-' + d.days}</span>`;
function list(items, kind) {
  if (!items.length) return `<div class="empty">${days}일 안에 ${kind === 'fab' ? '도착 예정인 원단' : '출고 예정'}이 없습니다.</div>`;
  let html = '', last = null;
  for (const d of items) {
    if (d.days !== last) {
      const same = items.filter(x => x.days === d.days);
      html += `<div class="day ${d.days < 0 ? 'late' : ''}"><span>${dayLabel(d)}</span><span>${same.length}건 · ${num(same.reduce((s, x) => s + (x.qty || 0), 0))} pcs</span></div>`;
      last = d.days;
    }
    const issue = kind === 'ship' && d.issue ? ` · <span class="iss">⚠ ${esc(d.issue)}</span>` : '';
    const more = [['원단 상태', d.fab], ['원단 입고', d.fd], ['선적·운송', d.td], ['이슈', d.iss], ['배분', d.alv], ['EX-FACTORY', d.exf], ['비고', d.note]]
      .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
    html += `<details><summary>${badge(d)}
        <span class="sty">${esc(d.style)}<span class="nm">${esc(d.name)}</span></span>
        <span class="qty">${num(d.qty)}</span><span class="fac">${esc(d.factory)}</span>
        <span class="meta">${esc(d.vendor)} ${esc(d.season)} · Buy ${esc(d.buy || '-')}${kind === 'fab' ? ' · ' + esc(d.status) : ''}${issue}</span>
      </summary><dl class="more">${more || '<dd>상세 정보 없음</dd>'}</dl></details>`;
  }
  return html;
}

async function fetchData() {
  if (REPO && TOKEN) {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/orders.json`, {
      headers: { Authorization: `Bearer ${TOKEN}`, Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? '접근 키가 만료되었거나 권한이 없습니다 (오더보드 설정에서 다시 입력)' : 'GitHub 응답 ' + r.status);
    return r.json();
  }
  if (/^(localhost|127\.0\.0\.1|192\.168\.|10\.)/.test(location.hostname)) return (await fetch('/board-data', { cache: 'no-store' })).json();
  throw new Error('NOKEY');
}

let DATA = null;
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', +b.dataset.d === days));
  if (!DATA) return;
  const o = windows(DATA.rows || [], days);
  const open = new Set([...document.querySelectorAll('details[open] .sty')].map(e => e.firstChild.textContent));
  $('fab').innerHTML = list(o.fabric, 'fab'); $('ship').innerHTML = list(o.ship, 'ship');
  document.querySelectorAll('details').forEach(d => { if (open.has(d.querySelector('.sty').firstChild.textContent)) d.open = true; });
  const late = o.fabric.filter(x => x.days < 0).length;
  $('fabSum').textContent = `${o.fabric.length}건 · ${num(o.fabric.reduce((s, x) => s + (x.qty || 0), 0))} pcs${late ? ` · 지연 ${late}` : ''}`;
  $('shipSum').textContent = `${o.ship.length}건 · ${num(o.ship.reduce((s, x) => s + (x.qty || 0), 0))} pcs`;
  const up = DATA.exportedAt ? new Date(DATA.exportedAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
  $('src').innerHTML = `자료: <b>${esc(DATA.source || '-')}</b>${DATA.asOf ? ` · Order Status <b>${esc(DATA.asOf)}</b> 기준` : ''} · 노트북 업로드 ${esc(up)}`;
  const pc = DATA.pc && (DATA.pc.urls || [])[0];
  if (pc) { $('gayaLink').hidden = false; $('gayaLink').href = pc; $('gayaLink').title = '노트북과 같은 Wi-Fi일 때만 열립니다'; }
}
async function load() {
  try {
    DATA = await fetchData(); LS.set('to.cache', JSON.stringify(DATA)); $('note').innerHTML = '';
  } catch (e) {
    const c = LS.get('to.cache'); if (c && !DATA) DATA = JSON.parse(c);
    $('note').innerHTML = e.message === 'NOKEY'
      ? `<div class="msg">이 탭에 오더보드 접근 키가 없습니다. 먼저 <a class="lnk" href="./">오더보드</a>를 열어 접근 키를 저장하면 이 화면도 자동으로 열립니다.</div>`
      : `<div class="msg">새 자료를 불러오지 못했습니다 (${esc(e.message)}). ${DATA ? '마지막으로 받은 자료를 보여 줍니다.' : ''}</div>`;
  }
  render();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { days = +b.dataset.d; LS.set('to.days', days); render(); });
load(); setInterval(load, 5 * 60000);
</script>
</body>
</html>
