<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Order Board</title>
<style>
  :root { --bg: #0a0d13; --panel: #131822; --panel2: #1a2130; --line: #232c3d; --text: #e9edf4; --muted: #8b95a8; --dim: #5b6578;
    --accent: #5aa9ff; --fab: #3ecf8e; --ship: #ff9b6a; --warn: #f5b942; --bad: #ff5c5c; --violet: #c8a2ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Samsung One', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(10,13,19,.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .bar h1 { font-size: 19px; margin: 0; white-space: nowrap; }
  .bar .src { flex: 1; min-width: 0; color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { font: inherit; font-size: 15px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  nav { display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto; }
  nav button { font: inherit; font-size: 15px; font-weight: 700; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); white-space: nowrap; cursor: pointer; }
  nav button.on { color: var(--text); border-color: var(--accent); background: rgba(90,169,255,.14); }
  nav button .n { font-size: 12px; margin-left: 4px; color: var(--bad); }
  main { padding: 14px 16px 40px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

  /* 2-week board */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  @media (max-width: 900px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .dayc { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 120px; padding: 8px; }
  .dayc.today { border-color: var(--accent); }
  .dayc.weekend { opacity: .8; }
  .dayc h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
  .dayc.today h3 { color: var(--accent); }
  .chip { display: block; width: 100%; text-align: left; font: inherit; border: 0; cursor: pointer; border-radius: 8px; padding: 6px 7px; margin-bottom: 5px; font-size: 13px; line-height: 1.3; color: var(--text); }
  .chip b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip small { color: var(--muted); font-size: 11.5px; }
  .chip.fab { background: rgba(62,207,142,.13); border-left: 3px solid var(--fab); }
  .chip.ship { background: rgba(255,155,106,.13); border-left: 3px solid var(--ship); }
  .chip.late { background: rgba(255,92,92,.15); border-left: 3px solid var(--bad); }
  .chip .flag { color: var(--warn); }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* lists */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
  .card > h2 { margin: 0; padding: 12px 14px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; }
  .card > h2 small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:active { background: var(--panel2); }
  .row .t { font-weight: 700; font-size: 15px; }
  .row .t span { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
  .row .q { font-family: Consolas, monospace; font-size: 14px; text-align: right; }
  .row .m { grid-column: 1 / -1; color: var(--dim); font-size: 12.5px; }
  .row .m .w { color: var(--warn); }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; margin-right: 4px; background: var(--panel2); color: var(--muted); }
  .pill.ok { color: var(--fab); } .pill.run { color: var(--accent); } .pill.watch, .pill.issue { color: var(--bad); background: rgba(255,92,92,.14); }
  .pill.new { color: var(--warn); } .pill.fc { color: var(--violet); }
  .empty { padding: 16px 14px; color: var(--muted); border-top: 1px solid var(--line); }

  /* search + filters */
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tools input { flex: 1 1 220px; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .tools select { font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }

  /* monthly */
  .mrow { display: grid; grid-template-columns: 90px 1fr 110px; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .stack { display: flex; height: 18px; border-radius: 5px; overflow: hidden; background: var(--panel2); }
  .stack i { display: block; height: 100%; }
  .mrow .v { text-align: right; font-family: Consolas, monospace; }

  /* detail sheet */
  .sheet { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(0,0,0,.55); }
  .sheet.on { display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 900px) { .sheet.on { align-items: center; } }
  .sheet .box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: min(760px, 100%); max-height: 88vh; overflow-y: auto; padding: 18px 18px 24px; }
  @media (min-width: 900px) { .sheet .box { border-radius: 18px; } }
  .sheet h2 { margin: 0 0 2px; font-size: 20px; }
  .sheet .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 12px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--dim); } .kv dd { margin: 0; white-space: pre-wrap; }
  .notes { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .checks { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .checks label { display: flex; align-items: center; gap: 6px; background: var(--panel2); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .checks input { width: 18px; height: 18px; }
  textarea { width: 100%; min-height: 70px; font: inherit; font-size: 15px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .sheet .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .btn { font: inherit; font-size: 15px; font-weight: 700; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #06121f; }
  .saved { color: var(--muted); font-size: 12.5px; align-self: center; margin-right: auto; }

  /* setup */
  .setup { max-width: 560px; margin: 30px auto; }
  .setup label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  .setup input { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .setup p { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .err { color: var(--bad); font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>오더 보드</h1>
    <div class="src" id="src"></div>
    <button class="icon" id="reload" title="새로고침">↻</button>
    <button class="icon" id="gear" title="설정">⚙</button>
  </div>
  <nav id="tabs">
    <button data-tab="board">2주 보드</button>
    <button data-tab="risk">위험·지연<span class="n" id="riskN"></span></button>
    <button data-tab="all">전체 스타일</button>
    <button data-tab="month">월별 물량</button>
  </nav>
</header>
<main id="main"></main>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>

<script>
// ---------- settings (stored only on this device) ----------
const LS = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };
const isLocalPC = /^(localhost|127\.0\.0\.1|192\.168\.|10\.)/.test(location.hostname) && location.port === '8765';
let REPO = LS.get('ob.repo') || 'koreareo-collab/gaya-orders-data', TOKEN = LS.get('ob.token') || '';

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => Number(v || 0).toLocaleString('en-US');
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const ST = { ok: '입고완료', run: '정상진행', watch: '주의·지연', issue: '이슈', new: '신규접수', fc: 'Forecast' };
const FAC_COLOR = { GAYA: '#5aa9ff', YBA: '#3ecf8e', WBG: '#c8a2ff', '미정': '#5b6578' };

let DATA = null, NOTES = {}, notesSha = null, tab = LS.get('ob.tab') || 'board';

// ---------- dates ----------
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
function nearest(m, d) {
  const t = today0(); let best = null;
  for (const y of [t.getFullYear() - 1, t.getFullYear(), t.getFullYear() + 1]) {
    const x = new Date(y, m - 1, d); if (!best || Math.abs(x - t) < Math.abs(best - t)) best = x;
  }
  return best;
}
const days = d => Math.round((d - today0()) / 86400000);
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;

// enrich every row with parsed dates
function prepare(rows) {
  return rows.map((r, i) => {
    const exfs = [...String(r.exf).matchAll(/(\d{1,2})\/(\d{1,2})/g)].map(m => nearest(+m[1], +m[2]));
    const fabDone = /^OK/i.test(r.fab);
    const fm = String(r.fab).match(/(\d{1,2})\/(\d{1,2})/);
    const fabDate = !fabDone && fm ? nearest(+fm[1], +fm[2]) : null;
    return { ...r, id: `${r.style}|${r.buy}|${i}`, key: `${r.style}|${r.buy}`, exfs, fabDone, fabDate, factory: (r.facs || []).join('+') || '-' };
  });
}

// ---------- data loading ----------
async function ghGet(file) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${file}`, {
    headers: { Authorization: `Bearer ${TOKEN}`, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status === 401 ? '접근 키가 맞지 않거나 만료되었습니다' : r.status === 403 ? '접근 키에 이 저장소 권한이 없습니다' : 'GitHub 오류 ' + r.status);
  const j = await r.json();
  const text = new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, '')), c => c.charCodeAt(0)));
  return { json: JSON.parse(text), sha: j.sha };
}
async function load() {
  $('src').textContent = '불러오는 중…';
  try {
    let o;
    if (REPO && TOKEN) {
      const f = await ghGet('orders.json');
      if (!f) throw new Error('저장소에 orders.json 이 아직 없습니다 (PC에서 첫 업로드 필요)');
      o = f.json;
      const n = await ghGet('notes.json').catch(() => null);
      NOTES = (n && n.json) || {}; notesSha = n ? n.sha : null;
    } else if (isLocalPC) {
      o = await (await fetch('/board-data', { cache: 'no-store' })).json();
      NOTES = JSON.parse(LS.get('ob.notes') || '{}');
    } else { return showSetup(); }
    DATA = { ...o, rows: prepare(o.rows) };
    LS.set('ob.cache', JSON.stringify(o));
    render();
  } catch (e) {
    const c = LS.get('ob.cache');
    if (c) { DATA = { ...JSON.parse(c), rows: prepare(JSON.parse(c).rows) }; render(); $('src').innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span> · 저장된 마지막 데이터 표시 중`; }
    else showSetup(e.message);
  }
}

// ---------- views ----------
function chip(r, kind, d) {
  const late = kind === 'fab' && days(d) < 0;
  const n = NOTES[r.key];
  const flags = (r.iss ? ' <span class="flag">⚠</span>' : '') + (n && n.done ? ' ✓' : '');
  return `<button class="chip ${late ? 'late' : kind}" data-id="${esc(r.id)}"><b>${esc(r.style)}${flags}</b><small>${kind === 'fab' ? '원단' : '출고'} · ${num(r.qty)} · ${esc(r.factory)}</small></button>`;
}
function viewBoard() {
  const t = today0(), start = new Date(t); start.setDate(t.getDate() - ((t.getDay() + 6) % 7)); // Monday
  const cells = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const fab = DATA.rows.filter(r => r.fabDate && +r.fabDate === +d);
    const ship = DATA.rows.filter(r => r.exfs.some(x => +x === +d));
    const total = ship.reduce((s, r) => s + r.qty, 0);
    cells.push(`<div class="dayc ${+d === +t ? 'today' : ''} ${d.getDay() % 6 === 0 ? 'weekend' : ''}">
      <h3><span>${md(d)} (${WD[d.getDay()]})</span><span>${total ? num(total) : ''}</span></h3>
      ${fab.map(r => chip(r, 'fab', d)).join('')}${ship.map(r => chip(r, 'ship', d)).join('')}</div>`);
  }
  const late = DATA.rows.filter(r => r.fabDate && days(r.fabDate) < 0 && days(r.fabDate) >= -14);
  return `<div class="legend"><span><i style="background:var(--fab)"></i>원단 자카르타 도착 예정</span><span><i style="background:var(--ship)"></i>출고 EX-FACTORY</span><span><i style="background:var(--bad)"></i>원단 예정일 지남</span><span>⚠ 이슈 있음 · ✓ 내가 체크한 것 · 칸 오른쪽 숫자 = 그날 출고 수량</span></div>
    <div class="week">${cells.slice(0, 7).join('')}</div><div class="week">${cells.slice(7).join('')}</div>
    ${late.length ? listCard('원단 예정일 지났는데 입고 안 됨 (최근 14일)', late, r => `원단 ${md(r.fabDate)} · ${-days(r.fabDate)}일 지남 · ${esc(r.fab)}`) : ''}`;
}
function row(r, meta) {
  const n = NOTES[r.key];
  return `<div class="row" data-id="${esc(r.id)}"><div class="t">${esc(r.style)}<span>${esc(r.name)}</span></div><div class="q">${num(r.qty)}</div>
    <div class="m"><span class="pill ${esc(r.st)}">${ST[r.st] || esc(r.st)}</span><span class="pill">${esc(r.factory)}</span>${esc(r.vendor)} ${esc(r.season)} · ${meta(r)}${r.iss ? ` · <span class="w">⚠ 이슈</span>` : ''}${n && n.done ? ' · ✓ 완료' : ''}${n && n.memo ? ` · 📝 ${esc(n.memo.slice(0, 40))}` : ''}</div></div>`;
}
function listCard(title, rows, meta, note = '') {
  return `<div class="card"><h2>${title}<small>${rows.length}건 · ${num(rows.reduce((s, r) => s + r.qty, 0))} pcs${note}</small></h2>
    ${rows.length ? rows.map(r => row(r, meta)).join('') : '<div class="empty">해당 없음</div>'}</div>`;
}
const exfText = r => r.exfs.length ? 'EX-F ' + r.exfs.map(md).join(' · ') : 'EX-F ' + (r.exf || '미정');
function riskLists() {
  const late = DATA.rows.filter(r => r.fabDate && days(r.fabDate) < 0);
  const soonShip = DATA.rows.filter(r => r.exfs.some(x => days(x) >= 0 && days(x) <= 3));
  const soonFab = DATA.rows.filter(r => r.fabDate && days(r.fabDate) >= 0 && days(r.fabDate) <= 7 && r.exfs.some(x => days(x) <= 45));
  const watch = DATA.rows.filter(r => (r.st === 'watch' || r.st === 'issue' || r.iss) && r.exfs.some(x => days(x) >= -3));
  return { late, soonShip, soonFab, watch };
}
function viewRisk() {
  const k = riskLists();
  return listCard('원단 예정일 지남 (아직 미입고)', k.late, r => `원단 ${md(r.fabDate)} (${-days(r.fabDate)}일 지남) · ${exfText(r)}`)
    + listCard('3일 안에 출고', k.soonShip, r => exfText(r) + ' · ' + esc(r.fab))
    + listCard('7일 안에 원단 도착 (출고 45일 이내)', k.soonFab, r => `원단 ${md(r.fabDate)} · ${exfText(r)}`)
    + listCard('주의·이슈 표시된 스타일', k.watch, r => exfText(r) + (r.iss ? ' · ' + esc(String(r.iss).split('\n').find(Boolean) || '').slice(0, 60) : ''));
}
let Q = { text: '', fac: '', vendor: '', season: '', st: '' };
function viewAll() {
  const opts = (k, vals) => `<select data-f="${k}"><option value="">${{ fac: '공장 전체', vendor: 'IKG·FENC', season: '시즌 전체', st: '상태 전체' }[k]}</option>${vals.map(v => `<option ${Q[k] === v ? 'selected' : ''} value="${esc(v)}">${esc(ST[v] || v)}</option>`).join('')}</select>`;
  const uniq = f => [...new Set(DATA.rows.flatMap(f))].filter(Boolean).sort();
  const t = Q.text.trim().toLowerCase();
  const rows = DATA.rows.filter(r => (!t || (r.style + ' ' + r.name).toLowerCase().includes(t))
    && (!Q.fac || r.facs.includes(Q.fac)) && (!Q.vendor || r.vendor === Q.vendor) && (!Q.season || r.season === Q.season) && (!Q.st || r.st === Q.st))
    .sort((a, b) => (a.exfs[0] || 9e15) - (b.exfs[0] || 9e15));
  return `<div class="tools"><input id="q" placeholder="스타일 번호·이름 검색" value="${esc(Q.text)}">
    ${opts('fac', uniq(r => r.facs))}${opts('vendor', uniq(r => [r.vendor]))}${opts('season', uniq(r => [r.season]))}${opts('st', uniq(r => [r.st]))}</div>
    <div id="allList">${listCard('스타일 (EX-FACTORY 순)', rows, r => `Buy ${esc(r.buy)} · ${exfText(r)} · 원단 ${esc(r.fab || '-')}`)}</div>`;
}
function viewMonth() {
  const map = new Map();
  for (const r of DATA.rows) {
    const d = r.exfs[0]; if (!d) continue;
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const m = map.get(k) || { total: 0, fac: {} };
    // split quantity across factories when an allocation is given
    if (r.alq && r.alq.length === r.facs.length) r.facs.forEach((f, i) => m.fac[f] = (m.fac[f] || 0) + r.alq[i]);
    else m.fac[r.factory] = (m.fac[r.factory] || 0) + r.qty;
    m.total += r.qty; map.set(k, m);
  }
  const keys = [...map.keys()].sort();
  const max = Math.max(...keys.map(k => map.get(k).total), 1);
  const facs = [...new Set(keys.flatMap(k => Object.keys(map.get(k).fac)))];
  const color = f => FAC_COLOR[f] || (f.includes('+') ? '#f5b942' : '#8b95a8');
  return `<div class="legend">${facs.map(f => `<span><i style="background:${color(f)}"></i>${esc(f)}</span>`).join('')}</div>
    <div class="card"><h2>EX-FACTORY 월별 물량 (공장별)<small>첫 출고일 기준</small></h2>
    ${keys.map(k => { const m = map.get(k); return `<div class="mrow"><span>${k.replace('-', '년 ')}월</span>
      <div class="stack" style="width:${Math.max(4, m.total / max * 100)}%">${Object.entries(m.fac).map(([f, q]) => `<i title="${esc(f)} ${num(q)}" style="width:${q / m.total * 100}%;background:${color(f)}"></i>`).join('')}</div>
      <span class="v">${num(m.total)}</span></div>`; }).join('')}</div>`;
}

function render() {
  if (!DATA) return;
  const age = DATA.exportedAt ? Math.round((Date.now() - Date.parse(DATA.exportedAt)) / 60000) : null;
  $('src').textContent = `Order Status ${DATA.asOf || ''} 기준 · ${DATA.rowCount}행` + (age != null ? ` · PC 업로드 ${age < 60 ? age + '분' : Math.round(age / 60) + '시간'} 전` : '');
  const k = riskLists();
  $('riskN').textContent = (k.late.length + k.soonShip.length) || '';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('main').innerHTML = tab === 'risk' ? viewRisk() : tab === 'all' ? viewAll() : tab === 'month' ? viewMonth() : viewBoard();
  if (tab === 'all') bindFilters();
}
function bindFilters() {
  const q = $('q');
  q.oninput = () => { Q.text = q.value; const pos = q.selectionStart; render(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll('select[data-f]').forEach(s => s.onchange = () => { Q[s.dataset.f] = s.value; render(); });
}

// ---------- detail sheet + notes ----------
function openDetail(id) {
  const r = DATA.rows.find(x => x.id === id); if (!r) return;
  const n = NOTES[r.key] || {};
  const kv = [['수량', num(r.qty) + ' pcs' + (r.alv ? `  (${r.alv})` : '')], ['Buy', r.buy], ['EX-FACTORY', r.exf], ['원단 상태', r.fab],
    ['원단 입고', r.fd], ['선적·운송', r.td], ['이슈', r.iss], ['PI', r.pi], ['비고', r.note]].filter(([, v]) => v);
  $('sheetBox').innerHTML = `<h2>${esc(r.style)}</h2>
    <div class="sub">${esc(r.name)} · <span class="pill ${esc(r.st)}">${ST[r.st] || esc(r.st)}</span> ${esc(r.vendor)} ${esc(r.season)} · ${esc(r.factory)}</div>
    <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <div class="notes"><div class="checks">
      ${[['done', '완료'], ['docs', '서류'], ['qc', 'QC'], ['booked', '선적 부킹']].map(([k, l]) => `<label><input type="checkbox" data-k="${k}" ${n[k] ? 'checked' : ''}>${l}</label>`).join('')}
    </div><textarea id="memo" placeholder="메모 (예: 11/15 Julie 회신 대기)">${esc(n.memo || '')}</textarea></div>
    <div class="actions"><span class="saved" id="saved">${n.at ? '마지막 저장 ' + new Date(n.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}</span>
      <button class="btn" id="close">닫기</button><button class="btn primary" id="save">저장</button></div>`;
  $('sheet').classList.add('on');
  $('close').onclick = () => $('sheet').classList.remove('on');
  $('save').onclick = async () => {
    const v = { memo: $('memo').value.trim(), at: Date.now() };
    document.querySelectorAll('.checks input').forEach(c => v[c.dataset.k] = c.checked);
    NOTES[r.key] = v;
    $('saved').textContent = '저장 중…';
    $('saved').textContent = await saveNotes() ? '저장됨 (모든 기기에서 보임)' : '이 기기에만 저장됨';
    render();
  };
}
async function saveNotes() {
  LS.set('ob.notes', JSON.stringify(NOTES));
  if (!(REPO && TOKEN)) return false;
  try {
    const latest = await ghGet('notes.json').catch(() => null); // merge with notes saved from other devices
    if (latest) { NOTES = { ...latest.json, ...NOTES }; notesSha = latest.sha; }
    const bytes = new TextEncoder().encode(JSON.stringify(NOTES, null, 1));
    let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/notes.json`, {
      method: 'PUT', headers: { Authorization: `Bearer ${TOKEN}`, Accept: 'application/vnd.github+json' },
      body: JSON.stringify({ message: 'notes update', content: btoa(bin), ...(notesSha ? { sha: notesSha } : {}) }) });
    if (!r.ok) return false;
    notesSha = (await r.json()).content.sha; return true;
  } catch { return false; }
}

// ---------- setup ----------
function showSetup(err) {
  $('src').textContent = '';
  $('main').innerHTML = `<div class="setup"><h2>처음 설정 (이 기기에서 한 번만)</h2>
    <p>오더 데이터는 비공개 GitHub 저장소에서 읽습니다. 접근 키는 <b>이 기기 안에만</b> 저장되며 다른 곳으로 보내지 않습니다.</p>
    <label>비공개 저장소 (아이디/저장소이름)</label><input id="sRepo" placeholder="예: myid/gaya-orders-data" value="${esc(REPO)}" autocapitalize="off">
    <label>GitHub 접근 키 (Fine-grained token)</label><input id="sTok" type="password" placeholder="github_pat_…" value="${esc(TOKEN)}" autocapitalize="off">
    <p>접근 키 만들기: GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate.<br>
    · Repository access: <b>Only select repositories</b> → 위 저장소 하나만<br>
    · Permissions → <b>Contents: Read and write</b> (메모 저장용. 보기만 하려면 Read-only)<br>
    · 만료 기간은 1년 정도로 두고, 탭을 잃어버리면 GitHub에서 바로 삭제하세요.</p>
    <button class="btn primary" id="sSave">저장하고 열기</button>
    ${REPO || TOKEN ? '<button class="btn" id="sClear" style="margin-left:6px">이 기기에서 키 지우기</button>' : ''}
    ${err ? `<div class="err">${esc(err)}</div>` : ''}</div>`;
  $('sSave').onclick = () => { REPO = $('sRepo').value.trim().replace(/^https:\/\/github\.com\//, '').replace(/\.git$/, ''); TOKEN = $('sTok').value.trim(); LS.set('ob.repo', REPO); LS.set('ob.token', TOKEN); load(); };
  if ($('sClear')) $('sClear').onclick = () => { LS.del('ob.repo'); LS.del('ob.token'); LS.del('ob.cache'); REPO = TOKEN = ''; showSetup(); };
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; LS.set('ob.tab', tab); render(); window.scrollTo(0, 0); return; }
  const c = e.target.closest('[data-id]');
  if (c && !e.target.closest('.sheet')) openDetail(c.dataset.id);
});
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('sheet').classList.remove('on'); });
$('reload').onclick = load;
$('gear').onclick = () => showSetup();
load();
setInterval(() => { if (!$('sheet').classList.contains('on') && document.visibilityState === 'visible') load(); }, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
</script>
</body>
</html>
